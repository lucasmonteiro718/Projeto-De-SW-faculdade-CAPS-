{% extends "base.html" %}
{% block conteudo %}
<h3>Cadastrar família</h3>
<form method="post" class="col-md-6">
  <label class="form-label">Responsável</label><input class="form-control mb-2" name="responsavel" required>
  <label class="form-label">Telefone</label><input class="form-control mb-2" name="telefone">
  <label class="form-label">Endereço</label><input class="form-control mb-3" name="endereco">
  <button class="btn btn-success">Salvar</button>
</form>
{% endblock %}
